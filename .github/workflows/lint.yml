name: Lint Jellybench

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Ruff (latest)
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: latest
          src: src/jellybench_py

